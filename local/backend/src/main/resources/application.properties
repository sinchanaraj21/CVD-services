spring.application.name=springboot

# ── Database ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/cvd
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# ── ML Service ──────────────────────────────────────────────────
ml.service.url=http://localhost:5001
ml.api.key=${CVD_ML_API_KEY:cvd_ml_internal_key_2024}

# ── JWT ─────────────────────────────────────────────────────────
jwt.secret=${CVD_JWT_SECRET:cvd_secret_key_for_jwt_token_generation_123456}

# ── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health

# ── Dev-only logging (remove or reduce in production) ───────────
spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
