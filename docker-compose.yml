services:
  postgres:
    image: postgres:15-alpine
    container_name: cvd-postgres
    environment:
      POSTGRES_DB: cvd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cvd-ml:
    build:
      context: ./local/xgboost
    container_name: cvd-ml
    ports:
      - "5001:5001"
    environment:
      CVD_ML_API_KEY: ${CVD_ML_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  cvd-backend:
    build:
      context: ./local/backend
    container_name: cvd-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CVD_ML_API_KEY: ${CVD_ML_API_KEY}
      CVD_JWT_SECRET: ${CVD_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      cvd-ml:
        condition: service_healthy

  cvd-frontend:
    build:
      context: ./local/frontend
    container_name: cvd-frontend
    ports:
      - "3000:80"
    depends_on:
      - cvd-backend

volumes:
  postgres_data:
